<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Coach</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#14161f;--mu:#6a6f85;--ac:#ff5a1f;--bd:#e2e4ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1016;--card:#191c26;--tx:#f2f3f8;--mu:#9a9fb6;--bd:#2a2e3e}}
:root[data-theme="dark"]{--bg:#0e1016;--card:#191c26;--tx:#f2f3f8;--mu:#9a9fb6;--bd:#2a2e3e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:19px;margin:0 0 8px}
p.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
label.f{display:block;font-weight:700;margin:12px 0 6px}
input[type=text],input[type=number],input[type=date]{width:100%;padding:12px 14px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px}
input:focus{outline:2px solid var(--ac)}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font:inherit;cursor:pointer}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;font-size:17px}
.err{color:#d93025;min-height:22px;margin-top:8px;font-size:14px}
.chip{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 12px;margin:0 6px 14px 0;font-size:14px;color:var(--mu)}
.opt{display:block;width:100%;text-align:start;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.opt:hover,.opt:active{border-color:var(--ac)}
.opt b{display:block;font-size:17px}.opt span{color:var(--mu);font-size:14px}
.opt i{float:right;font-style:normal;background:var(--ac);color:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;font-weight:700}
.wk{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-top:1px solid var(--bd);cursor:pointer}
.wk:first-of-type{border-top:0}
.wk b{min-width:96px}.wk span{flex:1;text-align:right;color:var(--ac);font-weight:600}
.wk.rest{cursor:default}.wk.rest span{color:var(--mu);font-weight:400}
